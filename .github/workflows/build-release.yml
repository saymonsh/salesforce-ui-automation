# Build the Windows installer (and, on a version tag, publish + mirror it).
#
# Runs deliberately — NOT on every push (that burned CI minutes). Triggers:
#   - PR merged into main  -> build-only smoke test (is main still releasable?)
#   - push of a v* tag     -> build + GitHub Release + push to the VPS mirror
#   - manual (Run workflow)-> build on demand
# A plain/direct push to main does NOT trigger; a push to a PR branch does NOT
# trigger (only the merge does). Release/mirror steps are gated on the tag ref,
# so a merge build can never publish.
#
# The runner needs: Python, Inno Setup, and GitHub egress (for the Flet desktop
# client fetch). All are available on the stock windows-latest image.

name: Build & Release

on:
  pull_request:
    types: [closed]        # gated below to merged-only
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # needed to create a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    # Skip PRs that were closed without merging; tag/manual runs always proceed.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Cache Flet desktop client
        # The Flutter client (~tens of MB) is fetched from GitHub once per Flet
        # version. Cache it so only the first build per version downloads it.
        # Keyed on the deps files since they pin the Flet version in practice.
        uses: actions/cache@v6
        with:
          path: ~/.flet/client
          key: flet-client-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}

      - name: Fetch Flet desktop client
        # Populate ~/.flet/client (cache miss only — egress is fine on the runner)
        # so build.spec can zip it into the bundle. THIS is what makes the
        # CI-built installer self-contained / offline-capable for the gov target.
        run: python -c "import flet_desktop; flet_desktop.ensure_client_cached()"

      - name: Build EXE (PyInstaller)
        run: pyinstaller build.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer (Inno Setup)
        run: iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: Output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Output/*.exe
          generate_release_notes: true

      - name: Push installer to VPS mirror
        # The gov machine can't reach GitHub (HTTPS out filtered), so it pulls
        # updates from the VPS over SSH. CI (unfiltered) pushes each tagged build
        # to the VPS upload endpoint over HTTPS. Skips silently if the secrets
        # aren't set (forks / first-time setup). See docs/packaging.md + vps/.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          KIVUN_UPLOAD_URL: ${{ secrets.KIVUN_UPLOAD_URL }}
          KIVUN_UPLOAD_TOKEN: ${{ secrets.KIVUN_UPLOAD_TOKEN }}
        run: |
          if (-not $env:KIVUN_UPLOAD_URL -or -not $env:KIVUN_UPLOAD_TOKEN) {
            Write-Host "VPS mirror secrets not set — skipping push."
            exit 0
          }
          $exe = (Get-ChildItem Output/*.exe | Select-Object -First 1).FullName
          $ver = (Select-String -Path src/core/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Pushing $exe (v$ver) to VPS mirror…"
          # multipart (field names: version, file) — matches the formidable-based
          # endpoint in the shalom.5784.link Node app (see vps/README.md).
          curl.exe --fail --silent --show-error `
            -H "Authorization: Bearer $env:KIVUN_UPLOAD_TOKEN" `
            -F "version=$ver" `
            -F "file=@$exe" `
            $env:KIVUN_UPLOAD_URL
